version: '3.8'

services:
  # 1. Shared MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: aicte-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: aicte_smartapproval
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Shared FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password123@mysql:3306/aicte_smartapproval
      - SECRET_KEY=aicte-smartapproval-secret-key-change-in-production-smart-india-hackathon-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - UPLOAD_DIR=/app/uploads
      - ALLOWED_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:5174","http://127.0.0.1:5174","https://institution.example.com","https://reviewer.example.com"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # 3. Institution Portal (Port 5173)
  institution-portal:
    build:
      context: ./apps/institution-portal
      dockerfile: Dockerfile
    container_name: aicte-institution-portal
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

  # 4. Reviewer Portal (Port 5174)
  reviewer-portal:
    build:
      context: ./apps/reviewer-portal
      dockerfile: Dockerfile
    container_name: aicte-reviewer-portal
    restart: unless-stopped
    ports:
      - "5174:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
